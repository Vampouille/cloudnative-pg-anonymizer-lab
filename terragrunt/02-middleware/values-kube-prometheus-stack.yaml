crds:
  enabled: true
global:
  rbac:
    createAggregateClusterRoles: true

grafana:
  forceDeployDashboards: true
  defaultDashboardsEnabled: true
  enabled: false
#  adminPassword: ${grafana_admin_password}
  nodeSelector:
      k8s.scaleway.com/project-env: infra
kube-state-metrics:
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 128Mi
  nodeSelector:
      k8s.scaleway.com/project-env: infra
prometheus:
  enabled: true
  prometheusSpec:
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    nodeSelector:
      k8s.scaleway.com/project-env: infra
    probeSelectorNilUsesHelmValues: false
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 2Gi
prometheus-node-exporter:
  prometheus:
    monitor:
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: instance
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 128Mi
prometheusOperator:
  admissionWebhooks:
    patch:
      nodeSelector:
        k8s.scaleway.com/project-env: infra
  nodeSelector:
    k8s.scaleway.com/project-env: infra
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 128Mi
kubelet:
  cAdvisorMetricRelabelings: # change default to add throttles info
    # Drop less useful container CPU metrics.
    #- sourceLabels: [__name__]
    #  action: drop
    #  regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)'
    # Drop less useful container / always zero filesystem metrics.
    - sourceLabels: [__name__]
      action: drop
      regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
    # Drop less useful / always zero container memory metrics.
    - sourceLabels: [__name__]
      action: drop
      regex: 'container_memory_(mapped_file|swap)'
    # Drop less useful container process metrics.
    - sourceLabels: [__name__]
      action: drop
      regex: 'container_(file_descriptors|tasks_state|threads_max)'
    # Drop container_memory_failures_total{scope="hierarchy"} metrics,
    # we only need the container scope.
    - sourceLabels: [__name__, scope]
      action: drop
      regex: 'container_memory_failures_total;hierarchy'
    # Drop container_network_... metrics that match various interfaces that
    # correspond to CNI and similar interfaces. This avoids capturing network
    # metrics for host network containers.
    - sourceLabels: [__name__, interface]
      action: drop
      regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
    # Drop container spec metrics that overlap with kube-state-metrics.
    - sourceLabels: [__name__]
      action: drop
      regex: 'container_spec.*'
    # Drop cgroup metrics with no pod.
    - sourceLabels: [id, pod]
      action: drop
      regex: '.+;'
defaultRules:
  disabled:
    KubeProxyDown: true
    KubeSchedulerDown: true
    KubeControllerManagerDown: true