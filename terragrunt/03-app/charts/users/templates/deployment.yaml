apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "users.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "users.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "users.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "users.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "users.fullname" . }}
      initContainers:
        # Fill the static emptyDir from GitHub (flat directory: instructions,
        # blocks, images). Restart the pod to pick up new commits.
        - name: fetch-static
          image: "{{ .Values.static.image.repository }}:{{ .Values.static.image.tag }}"
          imagePullPolicy: {{ .Values.static.image.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - |
              git clone --depth 1 --filter=blob:none --sparse --branch "$GIT_REF" "$GIT_REPO" /tmp/repo
              git -C /tmp/repo sparse-checkout set "$GIT_PATH"
              cp -v /tmp/repo/"$GIT_PATH"/* /static/
          env:
            - name: GIT_REPO
              value: {{ .Values.static.repo | quote }}
            - name: GIT_REF
              value: {{ .Values.static.ref | quote }}
            - name: GIT_PATH
              value: {{ .Values.static.path | quote }}
          volumeMounts:
            - name: static
              mountPath: /static
            - name: tmp
              mountPath: /tmp
      containers:
        - name: nginx
          #securityContext:
          #  capabilities:
          #    drop:
          #    - ALL
          #    add:
          #    - CAP_CHOWN
          #    - CAP_SETUID
          #  readOnlyRootFilesystem: true
          #  allowPrivilegeEscalation: false
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: static
              mountPath: /usr/share/nginx/html/static
              readOnly: true
            {{- range .Values.users }}
            - name: {{ .user }}
              mountPath: /usr/share/nginx/html/{{ .user }}
              readOnly: true
            {{- end }}
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: {{ include "users.fullname" . }}-nginx-conf
        - name: static
          emptyDir: {}
        {{- range .Values.users }}
        - name: {{ .user }}
          secret:
            secretName: {{ .user }}
        {{- end }}