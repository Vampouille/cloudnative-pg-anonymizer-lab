{{- range .Values.users }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "users.fullname" $ }}-{{ .user}}-instructions
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "users.labels" $ | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "{{ $.Release.Namespace }}-{{ .user }}-chain-instructions@kubernetescrd"
    cert-manager.io/cluster-issuer: "letsencrypt"
  {{- with $.Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ required (printf "users[%s].host is required" .user) .host }}
      secretName: {{ include "users.fullname" $ }}-{{ .user }}-tls
  rules:
    - host: {{ required (printf "users[%s].host is required" .user) .host }}
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ include "users.fullname" $ }}
                port:
                  name: http
