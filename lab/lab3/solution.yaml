---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: prod-copy-green
spec:
  instances: 1
  storage:
    size: 2Gi
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: camptocamp
    major: 18
  postgresGID: 999 # initdb: could not look up effective user ID 26: user does not exist
  postgresUID: 999
  bootstrap:
    initdb:
      import:
        type: monolith
        databases:
          - postgres
        source:
          externalCluster: prod
        pgDumpExtraOptions:
          - --no-owner
          - --no-privileges
  externalClusters:
    - name: prod
      connectionParameters:
        host: prod-rw
        user: skynet
        dbname: postgres
...
