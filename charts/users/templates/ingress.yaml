{{- range .Values.users }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "users.fullname" $ }}-{{ .username}}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "users.labels" $ | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "{{ $.Release.Namespace }}-basicauth-{{ .username }}@kubernetescrd"
    cert-manager.io/cluster-issuer: "letsencrypt"
  {{- with $.Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ .username }}.{{ $.Values.ingress.host }}
      secretName: {{ include "users.fullname" $ }}-{{ .username }}-tls
  rules:
    - host: {{ .username }}.{{ $.Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ include "users.fullname" $ }}
                port:
                  name: http
          - path: /kubeconfig
            pathType: Exact
            backend:
              service:
                name: {{ include "users.fullname" $ }}
                port:
                  name: http
{{- end }}