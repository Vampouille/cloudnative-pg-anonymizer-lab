{{- range .Values.users }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .user }}-admin
  namespace: {{ .user }}
  labels:
    {{- include "users.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .user }}
    namespace: {{ .user }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
{{- end }}
