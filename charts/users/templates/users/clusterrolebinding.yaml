{{- range .Values.users }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .username }}-workshop-viewer
  namespace: {{ .username }}
  labels:
    {{- include "users.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .username }}
    namespace: {{ .username }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-viewer
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-viewer
  labels:
    {{- include "users.labels" $ | nindent 4 }}
subjects:
{{- range .Values.users }}
  - kind: ServiceAccount
    name: {{ .username }}
    namespace: {{ .username }}
{{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-workshop-viewer
