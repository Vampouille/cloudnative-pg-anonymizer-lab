{{- range .Values.users }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .username }}-workshop-viewer
  labels:
    {{- include "users.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .username }}
    namespace: {{ .username }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-viewer
{{- end }}
