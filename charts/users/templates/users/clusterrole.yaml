---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-viewer
  labels:
    {{- include "users.labels" $ | nindent 4 }}
rules:
  # List / watch namespaces so Headlamp can populate the namespace selector
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Cluster-scoped resources useful for navigation in Headlamp
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # CNPG cluster-scoped visibility
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "scheduledbackups", "backups", "poolers"]
    verbs: ["get", "list", "watch"]
