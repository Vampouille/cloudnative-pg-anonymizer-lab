# user1.campto.camp/ --> /static/instructions.html
---
kind: Middleware
apiVersion: traefik.io/v1alpha1
metadata:
  name: rewrite-instructions
  namespace: {{ $.Release.Namespace }}
spec:
  replacePath:
    path: "/static/instructions.html"

# user1.campto.camp/favicon.ico --> /static/favicon.ico
---
kind: Middleware
apiVersion: traefik.io/v1alpha1
metadata:
  name: rewrite-favicon
  namespace: {{ $.Release.Namespace }}
spec:
  replacePath:
    path: "/static/favicon.ico"

{{- range .Values.users }}
# Basic auth for :
# * user1.campto.camp
# * user1.campto.camp/kubeconfig
---
kind: Middleware
apiVersion: traefik.io/v1alpha1
metadata:
  name: {{ .user }}-basicauth
  namespace: {{ $.Release.Namespace }}
spec:
  basicAuth:
    secret: {{ .user }}-basicauth
    removeHeader: true
---
kind: Secret
apiVersion: v1
metadata:
  name: {{ .user }}-basicauth
  namespace: {{ $.Release.Namespace }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .user }}
  password: {{ .password | quote }}

# * user1.campto.camp/kubeconfig.yaml --> /user1/kubeconfig.yaml
---
kind: Middleware
apiVersion: traefik.io/v1alpha1
metadata:
  name: {{ .user }}-rewrite-kubeconfig
  namespace: {{ $.Release.Namespace }}
spec:
  replacePath:
    path: "/{{ .user }}/kubeconfig.yaml"

# * user1.campto.camp/data --> /user1/data.json
---
kind: Middleware
apiVersion: traefik.io/v1alpha1
metadata:
  name: {{ .user }}-rewrite-data
  namespace: {{ $.Release.Namespace }}
spec:
  replacePath:
    path: "/{{ .user }}/data.json"

# Chain (rewrite + basicauth) Middleware for :
# * user1.campto.camp
---
kind: Middleware
apiVersion: traefik.io/v1alpha1
metadata:
  name: {{ .user }}-chain-instructions
  namespace: {{ $.Release.Namespace }}
spec:
  chain:
    middlewares:
    - name: {{ .user }}-basicauth
    - name: rewrite-instructions
# * user1.campto.camp/favicon.ico
---
kind: Middleware
apiVersion: traefik.io/v1alpha1
metadata:
  name: {{ .user }}-chain-favicon
  namespace: {{ $.Release.Namespace }}
spec:
  chain:
    middlewares:
    - name: {{ .user }}-basicauth
    - name: rewrite-favicon
# * user1.campto.camp/kubeconfig
---
kind: Middleware
apiVersion: traefik.io/v1alpha1
metadata:
  name: {{ .user }}-chain-kubeconfig
  namespace: {{ $.Release.Namespace }}
spec:
  chain:
    middlewares:
    - name: {{ .user }}-basicauth
    - name: {{ .user }}-rewrite-kubeconfig
# * user1.campto.camp/data
---
kind: Middleware
apiVersion: traefik.io/v1alpha1
metadata:
  name: {{ .user }}-chain-data
  namespace: {{ $.Release.Namespace }}
spec:
  chain:
    middlewares:
    - name: {{ .user }}-basicauth
    - name: {{ .user }}-rewrite-data
{{- end }}
